services:
  dockdash-agent:
    build: .
    image: dockdash-agent:local
    container_name: dockdash-agent
    restart: unless-stopped
    userns_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g
      - /root/.docker:rw,noexec,nosuid,size=16m
    ports:
      - "${DOCKDASH_AGENT_BIND:?Set DOCKDASH_AGENT_BIND to this host's management IP}:9002:9002"
    environment:
      DOCKDASH_COMPOSE_ROOTS: "/opt"
      DOCKDASH_MANAGED_ROOT: "/opt/dockdash-managed"
      DOCKDASH_AGENT_MIN_FREE_BYTES: "1073741824"
      DOCKDASH_AGENT_UPDATE_REGISTRIES: "docker.io,ghcr.io,lscr.io,quay.io,gcr.io,registry.k8s.io,public.ecr.aws,mcr.microsoft.com"
      DOCKDASH_AGENT_UPDATE_AUTH_HOSTS: "ghcr.io,quay.io,gcr.io,registry.k8s.io,auth.linuxserver.io,lscr.io,public.ecr.aws,mcr.microsoft.com"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /etc/dockdash-agent:/certs:ro
      - /mnt:/mnt:ro
      - /opt:/opt:rw
