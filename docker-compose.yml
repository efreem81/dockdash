services:
  dockdash:
    build: .
    image: dockdash:local
    container_name: dockdash
    ports:
      - "${DOCKDASH_PORT:-9999}:5000"
    volumes:
      # Mount Docker socket (or Podman socket for rootless: /run/user/1000/podman/podman.sock)
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Use bind mount for data directory (more reliable than named volumes)
      - ./data:/app/data
    networks:
      - dockdash-control
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - DEFAULT_USERNAME=${DEFAULT_USERNAME:-admin}
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:?Set DEFAULT_PASSWORD in .env}
      - DOCKDASH_PORT=${DOCKDASH_PORT:-9999}
      # Set HOST_IP to your server's LAN IP for correct container URLs
      - HOST_IP=${HOST_IP:-}
      # Session configuration
      - SESSION_LIFETIME_HOURS=${SESSION_LIFETIME_HOURS:-12}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
      # Auto-start background monitoring
      - AUTO_START_MONITORING=${AUTO_START_MONITORING:-0}
    # Run as root to access Docker socket (or use group_add for non-root)
    user: root
    restart: unless-stopped
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dockdash-worker:
    build: .
    image: dockdash:local
    restart: unless-stopped
    entrypoint: ["/app/worker-entrypoint.sh"]
    depends_on:
      dockdash:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - dockdash-control
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - DEFAULT_USERNAME=${DEFAULT_USERNAME:-admin}
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:?Set DEFAULT_PASSWORD in .env}
      - DOCKDASH_SKIP_DB_INIT=1
      - DOCKDASH_AGENT_CA=${DOCKDASH_AGENT_CA:-/app/data/pki/ca.crt}
      - DOCKDASH_AGENT_CERT=${DOCKDASH_AGENT_CERT:-/app/data/pki/controller.crt}
      - DOCKDASH_AGENT_KEY=${DOCKDASH_AGENT_KEY:-/app/data/pki/controller.key}
    healthcheck:
      disable: true

networks:
  dockdash-control:
    external: true
